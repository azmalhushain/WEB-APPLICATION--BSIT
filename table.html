<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Table using Colspan and rowspan</title> 
    </head>
    <body>
        <table border="0" align="center">
            <tr>
                <th colspan="2">Name</th>
                <th colspan="2">Phone</th>
            </tr>
            <tr>
                <td>First Name:</td>
                <td>ID:</td>
                <td>Person:</td>
                <td>Office:</td>
            </tr>
            <tr>
                <td>AJMAL BIN AJMAL</td>
                <td>005</td>
                <td>9798675172</td>
                <td>9827034783</td>
            </tr>
            <tr>
                <td>NIHAR BARMON</td>
                <td>001</td>
                <td>9798675173</td>
                <td>9827034784</td>
            </tr>
            <tr>
                <td>DEEBP DATTA</td>
                <td>004</td>
                <td>9798675174</td>
                <td>9827034785</td>
            </tr>
        </table>
        <br><br>
        <table border="1" align="center">
            <tr>
                <th>S.No.</th>
                <th>Name:</th>
                <th>Subject:</th>
                <th>Marks:</th>
                </th>
            </tr>
            <tr>
                <td rowspan="2">1</td>
                <td rowspan="2">AMIT</td>
                <td>Maths</td>
                <td>24</td>
            </tr>
            <tr>
                <td>DBMS</td>
                <td>27</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Juhi</td>
                <td>Maths</td>
                <td>22</td>
            </tr>
        </table>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background-color: #bcffff;
        }
    </style>
    </body>
</html>
